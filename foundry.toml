[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 500 }

[fmt]
number_underscore = "remove"
line_length = 4096
single_line_statement_blocks = "preserve"

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "screaming-snake-case-immutable",
]
